services:
  - type: web
    name: placementhub
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn placementhub_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: placementhub_project.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: placementhub-postgres
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: placementhub-postgres
    region: oregon
    plan: free
    databaseName: placementhub
    user: placementhub_user
