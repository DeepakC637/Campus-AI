{% extends "base.html" %}

{% block title %}Password Reset Complete - PlacementHub{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto; padding: 32px; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); font-family: sans-serif; text-align: center;">
  <div style="width: 52px; height: 52px; background-color: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
    <span style="font-size: 26px; color: #16a34a;">&#10003;</span>
  </div>
  <h2 style="font-size: 22px; font-weight: 700; color: #1e293b; margin: 0 0 12px 0;">Password Reset Complete</h2>
  <p style="color: #475569; font-size: 14px; line-height: 1.5; margin: 0 0 24px 0;">
    Your password has been set. You may now sign in with your new password.
  </p>
  <a href="{% url 'accounts:login' %}" style="display: inline-block; padding: 10px 20px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px;">Sign In</a>
</div>
{% endblock %}
