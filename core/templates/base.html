<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PlacementHub - AI-Powered Placement Portal{% endblock %}</title>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">
  <header>
    {% block header %}
    <!-- Navigation header placeholder -->
    {% endblock %}
  </header>

  <main class="flex-1">
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    {% block footer %}
    <!-- Footer placeholder -->
    {% endblock %}
  </footer>
</body>
</html>
