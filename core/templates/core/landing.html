{% extends "base.html" %}

{% block title %}Welcome - PlacementHub{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 40px auto; padding: 20px; font-family: sans-serif; text-align: center;">
  <h1 style="color: #2563eb; font-size: 2.5rem; margin-bottom: 0.5rem;">PlacementHub</h1>
  <p style="color: #475569; font-size: 1.25rem; margin-bottom: 2rem;">AI-Powered Campus Placement & Career Management Portal</p>
