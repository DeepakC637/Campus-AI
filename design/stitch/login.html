<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "primary-container": "#2563eb", "on-tertiary-fixed-variant": "#004c69", "surface-bright": "#f7f9fb", "on-surface-variant": "#434655", "on-tertiary": "#ffffff", "surface-container-high": "#e6e8ea", "primary": "#004ac6", "inverse-surface": "#2d3133", "background": "#f7f9fb", "error-container": "#ffdad6", "on-secondary": "#ffffff", "surface-container-highest": "#e0e3e5", "primary-fixed-dim": "#b4c5ff", "on-tertiary-container": "#e1f2ff", "primary-fixed": "#dbe1ff", "outline-variant": "#c3c6d7", "surface": "#f7f9fb", "on-tertiary-fixed": "#001e2c", "surface-container": "#eceef0", "surface-variant": "#e0e3e5", "on-secondary-fixed-variant": "#3f465c", "on-primary-container": "#eeefff", "surface-dim": "#d8dadc", "tertiary-fixed-dim": "#7bd0ff", "on-secondary-fixed": "#131b2e", "inverse-on-surface": "#eff1f3", "surface-container-low": "#f2f4f6", "on-primary": "#ffffff", "outline": "#737686", "inverse-primary": "#b4c5ff", "tertiary-container": "#00759f", "on-error": "#ffffff", "error": "#ba1a1a", "secondary-fixed-dim": "#bec6e0", "surface-container-lowest": "#ffffff", "surface-tint": "#0053db", "on-background": "#191c1e", "on-error-container": "#93000a", "on-secondary-container": "#5c647a", "on-surface": "#191c1e", "on-primary-fixed": "#00174b", "tertiary-fixed": "#c4e7ff", "secondary": "#565e74", "secondary-container": "#dae2fd", "on-primary-fixed-variant": "#003ea8", "tertiary": "#005b7c", "secondary-fixed": "#dae2fd" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-sm": "0.5rem", "gutter": "1.5rem", "space-xs": "0.25rem", "space-xl": "2.5rem", "margin": "2rem", "space-md": "1rem", "space-lg": "1.5rem" }, "fontFamily": { "label-sm": ["Inter"], "body-sm": ["Inter"], "headline-xl": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "label-md": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"] }, "fontSize": { "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface"><main class="w-full min-h-screen bg-surface flex items-center justify-center p-margin"><div class="flex flex-col w-full items-center justify-center py-space-xl px-space-md">
<!-- Subtle decorative ambient glows (contained) -->
<div class="relative w-full max-w-[460px]">
<div class="absolute -top-12 -left-12 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-10 -right-10 w-44 h-44 bg-tertiary-fixed-dim/20 rounded-full blur-2xl pointer-events-none"></div>
<!-- Main Card Container -->
<div class="relative w-full bg-surface-container-lowest rounded-xl shadow-xl p-space-xl flex flex-col">
<!-- PlacementHub Brand Header -->
<div class="flex flex-col items-center text-center">
<div class="flex items-center gap-space-xs bg-secondary-container/40 text-primary px-space-md py-space-xs rounded-full mb-space-md">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm font-semibold tracking-wide uppercase">PlacementHub AI</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">
          Welcome back
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">
          Sign in to your campus recruitment portal
        </p>
</div>
<!-- Role Selector Tabs -->
<div class="mt-space-lg p-space-xs bg-surface-container-low rounded-lg flex items-center justify-between gap-1" id="roleSelectorGroup">
<button class="flex-1 py-2 px-3 rounded-lg text-center font-label-md text-label-md font-semibold transition-all duration-200 bg-primary-container text-on-primary shadow-sm flex items-center justify-center gap-1.5" id="tab-student" onclick="selectRole('student')" type="button">
<span class="material-symbols-outlined text-[16px]">school</span>
<span>Student</span>
</button>
<button class="flex-1 py-2 px-3 rounded-lg text-center font-label-md text-label-md font-medium transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-container flex items-center justify-center gap-1.5" id="tab-recruiter" onclick="selectRole('recruiter')" type="button">
<span class="material-symbols-outlined text-[16px]">business_center</span>
<span>Recruiter</span>
</button>
<button class="flex-1 py-2 px-3 rounded-lg text-center font-label-md text-label-md font-medium transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-container flex items-center justify-center gap-1.5" id="tab-admin" onclick="selectRole('admin')" type="button">
<span class="material-symbols-outlined text-[16px]">admin_panel_settings</span>
<span>Admin</span>
</button>
</div>
<!-- Authentication Form -->
<form class="mt-space-lg flex flex-col gap-space-md" onsubmit="event.preventDefault(); simulateSubmit();">
<!-- Email Input Section -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md font-medium text-on-surface" for="emailInput" id="emailLabel">
            Institutional Email
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors" id="emailIcon">mail</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md pl-11 pr-4 py-2.5 rounded-lg bg-surface-container-low/50 focus:bg-surface-container-lowest outline-none focus:shadow-[0_0_0_2px_#2563eb] transition-all placeholder:text-outline/70" id="emailInput" placeholder="alex.chen@university.edu" required="" type="email"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant text-right" id="roleSubtext">Must end with authorized academic domain</span>
</div>
<!-- Password Input Section -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md font-medium text-on-surface flex justify-between items-center" for="passwordInput">
<span>Password</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors" id="lockIcon">lock</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md pl-11 pr-11 py-2.5 rounded-lg bg-surface-container-low/50 focus:bg-surface-container-lowest outline-none focus:shadow-[0_0_0_2px_#2563eb] transition-all placeholder:text-outline/70" id="passwordInput" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface p-1 rounded transition-colors flex items-center justify-center" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Device & Forgot Password Row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<input class="w-4 h-4 rounded text-primary-container accent-primary-container focus:ring-0 cursor-pointer" id="rememberMe" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember this device</span>
</label>
<a class="font-label-sm text-label-sm font-semibold text-primary-container hover:text-primary transition-colors" href="#">
            Forgot password?
          </a>
</div>
<!-- Primary CTA Submit Button -->
<button class="w-full mt-2 py-3 px-4 rounded-lg bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md font-semibold shadow-md hover:shadow-lg active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2" id="submitBtn" type="submit">
<span id="btnText">Log In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Institutional SSO Divider -->
<div class="relative my-space-lg flex items-center justify-center">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-sm text-label-sm text-on-surface-variant select-none">
          Or continue with University SSO
        </span>
</div>
<!-- SSO Alternative Buttons -->
<div class="grid grid-cols-2 gap-space-sm">
<button class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface font-label-sm text-label-sm font-medium transition-colors" type="button">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="#005b7c"></path>
</svg>
<span>Campus ID</span>
</button>
<button class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface font-label-sm text-label-sm font-medium transition-colors" type="button">
<span class="material-symbols-outlined text-primary text-[18px]">vpn_key</span>
<span>SAML 2.0</span>
</button>
</div>
<!-- Registration Footer link -->
<div class="mt-space-lg pt-space-md text-center bg-surface-container-lowest flex flex-col items-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
          Don't have an account? 
          <a class="font-label-sm text-label-sm font-semibold text-primary-container hover:text-primary transition-colors ml-1" href="#">
            Register here
          </a>
</p>
<!-- Academic Network Protection Notice -->
<div class="mt-space-sm flex items-center justify-center gap-1.5 text-on-surface-variant/70 font-body-sm text-[11px]">
<span class="material-symbols-outlined text-[13px]">verified_user</span>
<span>256-bit SSL Protected Campus Grid</span>
</div>
</div>
</div>
</div>
<script>
    let activeRole = 'student';

    function selectRole(role) {
      activeRole = role;
      const roles = ['student', 'recruiter', 'admin'];
      const emailInput = document.getElementById('emailInput');
      const emailLabel = document.getElementById('emailLabel');
      const roleSubtext = document.getElementById('roleSubtext');
      const btnText = document.getElementById('btnText');

      roles.forEach(r => {
        const btn = document.getElementById('tab-' + r);
        if (r === role) {
          btn.className = 'flex-1 py-2 px-3 rounded-lg text-center font-label-md text-label-md font-semibold transition-all duration-200 bg-primary-container text-on-primary shadow-sm flex items-center justify-center gap-1.5';
        } else {
          btn.className = 'flex-1 py-2 px-3 rounded-lg text-center font-label-md text-label-md font-medium transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-container flex items-center justify-center gap-1.5';
        }
      });

      if (role === 'student') {
        emailLabel.innerText = 'Institutional Email';
        emailInput.placeholder = 'alex.chen@university.edu';
        roleSubtext.innerText = 'Must end with authorized academic domain';
        btnText.innerText = 'Log In as Student';
      } else if (role === 'recruiter') {
        emailLabel.innerText = 'Work Email Address';
        emailInput.placeholder = 'recruiter@company.com';
        roleSubtext.innerText = 'Corporate recruiter portal access';
        btnText.innerText = 'Log In as Recruiter';
      } else if (role === 'admin') {
        emailLabel.innerText = 'TPO / Officer Email';
        emailInput.placeholder = 'director.placement@university.edu';
        roleSubtext.innerText = 'Administrative privileges required';
        btnText.innerText = 'Log In as Admin';
      }
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerText = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerText = 'visibility';
      }
    }

    function simulateSubmit() {
      const btn = document.getElementById('submitBtn');
      const originalText = document.getElementById('btnText').innerText;
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Authenticating...</span>';
      
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Authenticated</span>';
        setTimeout(() => {
          btn.innerHTML = `<span id="btnText">${originalText}</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>`;
        }, 1500);
      }, 1000);
    }
  </script>
</div></main></body></html>
